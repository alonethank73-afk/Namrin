<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OCR SCANNER</title>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;600&display=swap');
 
  :root {
    --bg: #050810; --bg2: #080d1a; --bg3: #0c1225;
    --cyan: #00e5ff; --cyan2: #00b4cc; --green: #00ff9d;
    --orange: #ff6b35; --red: #ff2d55; --text: #c8d8e8;
    --text2: #6a8aaa; --border: rgba(0,229,255,0.2); --glow: 0 0 20px rgba(0,229,255,0.4);
  }
 
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--bg); color: var(--text); font-family: 'Rajdhani', sans-serif; min-height: 100vh; overflow-x: hidden; }
  body::before { content: ''; position: fixed; inset: 0; background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.08) 2px, rgba(0,0,0,0.08) 4px); pointer-events: none; z-index: 1000; }
  body::after { content: ''; position: fixed; inset: 0; background-image: linear-gradient(rgba(0,229,255,0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(0,229,255,0.03) 1px, transparent 1px); background-size: 40px 40px; pointer-events: none; z-index: 0; }
 
  .container { position: relative; z-index: 1; max-width: 1200px; margin: 0 auto; padding: 20px; }
 
  /* ── Header ── */
  header { display: flex; align-items: center; justify-content: space-between; padding: 20px 0 24px; border-bottom: 1px solid var(--border); margin-bottom: 28px; }
  .logo { display: flex; align-items: center; gap: 14px; }
  .logo-icon { width: 48px; height: 48px; border: 2px solid var(--cyan); border-radius: 8px; display: flex; align-items: center; justify-content: center; box-shadow: var(--glow), inset 0 0 12px rgba(0,229,255,0.1); animation: pulse-border 3s ease-in-out infinite; }
  @keyframes pulse-border { 0%,100% { box-shadow: var(--glow), inset 0 0 12px rgba(0,229,255,0.1); } 50% { box-shadow: 0 0 30px rgba(0,229,255,0.7), inset 0 0 20px rgba(0,229,255,0.2); } }
  .logo-icon svg { width: 26px; height: 26px; }
  .logo-text h1 { font-family: 'Orbitron', monospace; font-size: 20px; font-weight: 900; color: var(--cyan); letter-spacing: 4px; text-shadow: 0 0 20px rgba(0,229,255,0.5); }
  .logo-text p { font-family: 'Share Tech Mono', monospace; font-size: 11px; color: var(--text2); letter-spacing: 2px; }
  .header-status { display: flex; align-items: center; gap: 8px; font-family: 'Share Tech Mono', monospace; font-size: 12px; color: var(--text2); }
  .status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--red); animation: blink 1s infinite; }
  .status-dot.online { background: var(--green); animation: none; box-shadow: 0 0 8px var(--green); }
  .status-dot.processing { background: var(--orange); animation: blink 0.4s infinite; }
  @keyframes blink { 0%,100% { opacity:1; } 50% { opacity:0.2; } }
 
  /* ── Layout ── */
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  @media (max-width: 768px) { .grid { grid-template-columns: 1fr; } }
 
  .panel { background: var(--bg2); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; position: relative; }
  .panel::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 1px; background: linear-gradient(90deg, transparent, var(--cyan), transparent); opacity: 0.5; }
  .panel-header { display: flex; align-items: center; justify-content: space-between; padding: 14px 18px; border-bottom: 1px solid var(--border); background: rgba(0,229,255,0.03); }
  .panel-title { font-family: 'Orbitron', monospace; font-size: 11px; font-weight: 700; letter-spacing: 3px; color: var(--cyan2); }
  .panel-tag { font-family: 'Share Tech Mono', monospace; font-size: 10px; color: var(--text2); background: rgba(0,229,255,0.08); padding: 3px 8px; border-radius: 4px; border: 1px solid var(--border); }
  .panel-body { padding: 18px; }
 
  /* ── Camera ── */
  .camera-view { position: relative; width: 100%; aspect-ratio: 4/3; background: #02060f; border-radius: 8px; overflow: hidden; border: 1px solid rgba(0,229,255,0.15); }
  #videoEl, #capturedImg { width: 100%; height: 100%; object-fit: cover; display: block; }
  #capturedImg { display: none; }
  .cam-overlay { position: absolute; inset: 0; pointer-events: none; }
  .corner { position: absolute; width: 20px; height: 20px; border-color: var(--cyan); border-style: solid; opacity: 0.6; }
  .corner.tl { top:8px; left:8px; border-width: 2px 0 0 2px; }
  .corner.tr { top:8px; right:8px; border-width: 2px 2px 0 0; }
  .corner.bl { bottom:8px; left:8px; border-width: 0 0 2px 2px; }
  .corner.br { bottom:8px; right:8px; border-width: 0 2px 2px 0; }
  .scan-line { position: absolute; left: 0; right: 0; height: 2px; background: linear-gradient(90deg, transparent, var(--cyan), var(--cyan), transparent); opacity: 0; box-shadow: 0 0 8px var(--cyan); }
  .scan-line.active { opacity: 0.7; animation: scan 2s ease-in-out infinite; }
  @keyframes scan { 0% { top: 0; } 100% { top: 100%; } }
  .cam-placeholder { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; color: var(--text2); font-family: 'Share Tech Mono', monospace; font-size: 12px; letter-spacing: 1px; }
  .cam-placeholder svg { opacity: 0.3; }
 
  /* ── Buttons ── */
  .btn-group { display: flex; gap: 10px; margin-top: 14px; }
  .btn { flex: 1; padding: 12px 16px; border: none; border-radius: 8px; cursor: pointer; font-family: 'Orbitron', monospace; font-size: 11px; font-weight: 700; letter-spacing: 2px; transition: all 0.2s; position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; gap: 8px; }
  .btn::after { content: ''; position: absolute; inset: 0; background: white; opacity: 0; transition: opacity 0.15s; }
  .btn:active::after { opacity: 0.1; }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }
 
  .btn-primary { background: linear-gradient(135deg, #005f72, #007a90); color: var(--cyan); border: 1px solid var(--cyan2); box-shadow: 0 0 15px rgba(0,229,255,0.2); }
  .btn-primary:hover:not(:disabled) { background: linear-gradient(135deg, #007a90, #009ab4); box-shadow: 0 0 25px rgba(0,229,255,0.4); transform: translateY(-1px); }
 
  .btn-capture { background: linear-gradient(135deg, #1a3a1a, #1f4f1f); color: var(--green); border: 1px solid rgba(0,255,157,0.4); box-shadow: 0 0 15px rgba(0,255,157,0.15); }
  .btn-capture:hover:not(:disabled) { background: linear-gradient(135deg, #1f4f1f, #256425); box-shadow: 0 0 25px rgba(0,255,157,0.35); transform: translateY(-1px); }
  .btn-capture.active-scan { background: linear-gradient(135deg, #b3122c, #e61938); border-color: #ff2d55; box-shadow: 0 0 20px rgba(255, 45, 85, 0.4); color: white; animation: pulse-red 2s infinite; }
  @keyframes pulse-red { 0%,100% { box-shadow: 0 0 15px rgba(255,45,85,0.3); } 50% { box-shadow: 0 0 30px rgba(255,45,85,0.6); } }

  .btn-speak { background: linear-gradient(135deg, #2a1a0a, #3d2810); color: var(--orange); border: 1px solid rgba(255,107,53,0.4); box-shadow: 0 0 15px rgba(255,107,53,0.15); }
  .btn-speak:hover:not(:disabled) { background: linear-gradient(135deg, #3d2810, #522e10); box-shadow: 0 0 25px rgba(255,107,53,0.35); transform: translateY(-1px); }
 
  .btn-danger { background: linear-gradient(135deg, #2a0a10, #400015); color: var(--red); border: 1px solid rgba(255,45,85,0.4); }
  .btn-danger:hover:not(:disabled) { opacity: 0.85; }
 
  .btn-reset { background: linear-gradient(135deg, #1a2a40, #2a4060); color: var(--text); border: 1px solid var(--text2); }
  .btn-reset:hover { background: linear-gradient(135deg, #2a4060, #3a5070); }
  .btn svg { flex-shrink: 0; }
 
  /* ── OCR Area ── */
  .result-area { min-height: 180px; background: #02060f; border-radius: 8px; border: 1px solid rgba(0,229,255,0.1); padding: 16px; position: relative; overflow: hidden; }
  .result-text { font-family: 'Share Tech Mono', monospace; font-size: 14px; line-height: 1.7; color: var(--green); word-break: break-word; white-space: pre-wrap; min-height: 100px; }
  .result-placeholder { color: var(--text2); font-family: 'Share Tech Mono', monospace; font-size: 12px; position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); text-align: center; letter-spacing: 1px; line-height: 1.8; }
 
  .progress-wrap { height: 3px; background: rgba(0,229,255,0.1); border-radius: 3px; margin: 12px 0; overflow: hidden; }
  .progress-bar { height: 100%; width: 0%; background: linear-gradient(90deg, var(--cyan2), var(--cyan)); transition: width 0.3s; box-shadow: 0 0 8px var(--cyan); }
 
  .log-area { background: #02060f; border-radius: 8px; border: 1px solid rgba(0,229,255,0.1); padding: 12px 14px; max-height: 130px; overflow-y: auto; font-family: 'Share Tech Mono', monospace; font-size: 11px; scrollbar-width: thin; scrollbar-color: var(--cyan2) transparent; }
  .log-line { display: flex; gap: 8px; padding: 2px 0; opacity: 0; animation: fadeIn 0.3s forwards; }
  @keyframes fadeIn { to { opacity: 1; } }
  .log-time { color: var(--text2); }
  .log-msg { color: var(--text); }
  .log-msg.ok { color: var(--green); }
  .log-msg.err { color: var(--red); }
  .log-msg.info { color: var(--cyan); }
  .log-msg.warn { color: var(--orange); }
 
  .confidence-row { display: flex; align-items: center; gap: 10px; margin-top: 10px; }
  .conf-label { font-family: 'Share Tech Mono', monospace; font-size: 11px; color: var(--text2); }
  .conf-bar-wrap { flex: 1; height: 6px; background: rgba(255,255,255,0.07); border-radius: 6px; overflow: hidden; }
  .conf-bar { height: 100%; width: 0%; border-radius: 6px; transition: width 0.8s ease, background 0.8s; }
  .conf-val { font-family: 'Orbitron', monospace; font-size: 11px; font-weight: 700; min-width: 40px; text-align: right; }
 
  .tts-controls { display: flex; align-items: center; gap: 12px; margin-top: 12px; flex-wrap: wrap; }
  .tts-label { font-family: 'Share Tech Mono', monospace; font-size: 11px; color: var(--text2); white-space: nowrap; }
  .tts-select { background: var(--bg3); border: 1px solid var(--border); border-radius: 6px; color: var(--text); font-family: 'Share Tech Mono', monospace; font-size: 11px; padding: 5px 8px; outline: none; cursor: pointer; }
  input[type=range] { -webkit-appearance: none; flex: 1; height: 3px; background: rgba(0,229,255,0.2); border-radius: 3px; outline: none; min-width: 80px; }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; background: var(--cyan); border-radius: 50%; cursor: pointer; box-shadow: 0 0 8px var(--cyan); }
  .range-val { font-family: 'Orbitron', monospace; font-size: 11px; color: var(--cyan); min-width: 30px; text-align: right; }

  .arduino-badge { display: flex; align-items: center; gap: 8px; padding: 8px 14px; background: rgba(0,255,157,0.05); border: 1px solid rgba(0,255,157,0.2); border-radius: 8px; margin-top: 12px; font-family: 'Share Tech Mono', monospace; font-size: 11px; color: var(--text2); }
  .arduino-badge .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--text2); flex-shrink: 0; }
  .arduino-badge.received .dot { background: var(--green); box-shadow: 0 0 8px var(--green); animation: blink 0.5s 3; }
 
  .speaking-wave { display: none; align-items: flex-end; gap: 3px; height: 20px; margin-left: 8px; }
  .speaking-wave.active { display: flex; }
  .wave-bar { width: 3px; background: var(--orange); border-radius: 2px; animation: wave 0.8s ease-in-out infinite; }
  .wave-bar:nth-child(1) { animation-delay: 0s; height: 8px; }
  .wave-bar:nth-child(2) { animation-delay: 0.1s; height: 14px; }
  .wave-bar:nth-child(3) { animation-delay: 0.2s; height: 18px; }
  .wave-bar:nth-child(4) { animation-delay: 0.3s; height: 12px; }
  .wave-bar:nth-child(5) { animation-delay: 0.4s; height: 8px; }
  @keyframes wave { 0%,100% { transform: scaleY(0.4); } 50% { transform: scaleY(1); } }
 
  .copy-toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(20px); background: var(--bg3); border: 1px solid var(--border); color: var(--cyan); padding: 10px 20px; border-radius: 8px; font-family: 'Share Tech Mono', monospace; font-size: 12px; opacity: 0; transition: all 0.3s; z-index: 9999; pointer-events: none; }
  .copy-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
 
<div class="container">
  <header>
    <div class="logo">
      <div class="logo-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="#00e5ff" stroke-width="1.5"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/><path d="M7 7h.01M17 7h.01M12 10a2 2 0 100-4 2 2 0 000 4z" stroke-linecap="round"/><path d="M7 12s1.5-2 5-2 5 2 5 2" stroke-linecap="round"/></svg>
      </div>
      <div class="logo-text">
        <h1>OCR SCANNER</h1>
        <p>RAW IMAGE DETECTION v4.0</p>
      </div>
    </div>
    <div class="header-status">
      <div class="status-dot" id="wsDot"></div>
      <span id="wsLabel">DISCONNECTED</span>
    </div>
  </header>
 
  <div class="grid">
    <div>
      <div class="panel">
        <div class="panel-header">
          <span class="panel-title">CAMERA INPUT</span>
          <span class="panel-tag" id="sourceTag">WEBCAM</span>
        </div>
        <div class="panel-body">
          <div class="camera-view">
            <video id="videoEl" autoplay playsinline muted></video>
            <img id="capturedImg" alt="Captured">
            <div class="cam-overlay">
              <div class="corner tl"></div><div class="corner tr"></div>
              <div class="corner bl"></div><div class="corner br"></div>
              <div class="scan-line" id="scanLine"></div>
            </div>
            <div class="cam-placeholder" id="camPlaceholder">
              <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1"><rect x="2" y="6" width="20" height="15" rx="2"/><circle cx="12" cy="13" r="3.5"/><path d="M9 6l1.5-3h3L15 6"/></svg>
              <span>CAMERA NOT ACTIVE</span>
              <span style="font-size:10px;opacity:0.6">PRESS START TO INITIALIZE</span>
            </div>
          </div>
 
          <div class="arduino-badge" id="arduinoBadge">
            <div class="dot"></div>
            <span id="arduinoStatus">Waiting for Arduino signal...</span>
          </div>
 
          <div class="btn-group">
            <button class="btn btn-primary" id="btnStart" onclick="startCamera()">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 7l-7 5 7 5V7z"/><rect x="1" y="5" width="15" height="14" rx="2"/></svg>
              START CAM
            </button>
            <button class="btn btn-capture" id="btnCapture" onclick="toggleAutoScan()" disabled>
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="8"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2"/></svg>
              <span id="autoScanLabel">AUTO SCAN</span>
            </button>
          </div>
        </div>
      </div>
    </div>
 
    <div>
      <div class="panel">
        <div class="panel-header">
          <span class="panel-title">OCR RESULT</span>
          <span class="panel-tag" id="ocrStatus">IDLE</span>
        </div>
        <div class="panel-body">
          <div class="progress-wrap"><div class="progress-bar" id="progressBar"></div></div>
 
          <div class="result-area">
            <div class="result-placeholder" id="resultPlaceholder">
              AWAITING SCAN INPUT<br>
              <span style="font-size:10px;opacity:0.5">Start auto-scan or wait for board</span>
            </div>
            <div class="result-text" id="resultText"></div>
          </div>
 
          <div class="confidence-row">
            <span class="conf-label">CONFIDENCE</span>
            <div class="conf-bar-wrap"><div class="conf-bar" id="confBar"></div></div>
            <span class="conf-val" id="confVal" style="color: var(--text2)">—</span>
          </div>
 
          <div class="tts-controls">
            <span class="tts-label">VOICE</span>
            <select class="tts-select" id="voiceSelect"></select>
            <span class="tts-label">RATE</span>
            <input type="range" id="rateSlider" min="0.5" max="2" step="0.1" value="1">
            <span class="range-val" id="rateVal">1.0</span>
          </div>
 
          <div class="btn-group" style="margin-top: 12px;">
            <button class="btn btn-speak" id="btnSpeak" onclick="speakText()" disabled>
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M15.54 8.46a5 5 0 010 7.07M19.07 4.93a10 10 0 010 14.14"/></svg>
              <span id="speakLabel">SPEAK</span>
              <div class="speaking-wave" id="speakingWave"><div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div></div>
            </button>
            <button class="btn btn-danger" id="btnCopy" onclick="copyText()" disabled>
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg> COPY
            </button>
            <button class="btn btn-reset" onclick="resetScanner()">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg> RESET
            </button>
          </div>
        </div>
      </div>
 
      <div class="panel" style="margin-top: 20px;">
        <div class="panel-header">
          <span class="panel-title">SYSTEM LOG</span>
          <button class="btn btn-danger" style="flex:0;padding:4px 10px;font-size:9px;" onclick="clearLog()">CLEAR</button>
        </div>
        <div class="panel-body" style="padding: 10px;">
          <div class="log-area" id="logArea"></div>
        </div>
      </div>
    </div>
  </div>
</div>
 
<div class="copy-toast" id="copyToast">✓ TEXT COPIED TO CLIPBOARD</div>
 
<script>
// ─── State ────────────────────────────────────────────────────────────────────
let stream = null;
let ws = null;
let currentText = '';
let isSpeaking = false;
let voices = [];
let ocrBusy = false;
let autoScanTimer = null;
let pendingImage = null;

// ─── WebSocket ────────────────────────────────────────────────────────────────
function connectWS() {
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  ws = new WebSocket(`${proto}://${location.host}`);
 
  ws.onopen = () => { setWSStatus(true); log('WebSocket connected to server', 'ok'); };
  ws.onmessage = (event) => {
    const msg = JSON.parse(event.data);
    if (msg.type === 'arduino_image') {
      log('Arduino Priority: Image received!', 'info');
      showArduinoSignal();
      if (autoScanTimer) {
        toggleAutoScan();
        log('Switched to Arduino Mode', 'warn');
      }
      displayImage(msg.data); // โชว์ภาพจากบอร์ด
      runOCR(msg.data);       // ส่งภาพสดเข้า AI เลย
    } else if (msg.type === 'connected') {
      log('Server handshake OK', 'ok');
    }
  };
  ws.onclose = () => { setWSStatus(false); setTimeout(connectWS, 3000); };
}
 
function setWSStatus(online) {
  const dot = document.getElementById('wsDot');
  const label = document.getElementById('wsLabel');
  dot.className = 'status-dot' + (online ? ' online' : '');
  label.textContent = online ? 'SERVER ONLINE' : 'DISCONNECTED';
}

// ─── Camera & Auto Scan ───────────────────────────────────────────────────────
async function startCamera() {
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment', width: 1280 }, audio: false });
    const video = document.getElementById('videoEl');
    video.srcObject = stream; video.style.display = 'block';
    document.getElementById('capturedImg').style.display = 'none';
    document.getElementById('camPlaceholder').style.display = 'none';
    
    document.getElementById('btnCapture').disabled = false;
    document.getElementById('btnStart').textContent = '■ STOP';
    document.getElementById('btnStart').setAttribute('onclick', 'stopCamera()');
    document.getElementById('sourceTag').textContent = 'WEBCAM LIVE';
    log('Webcam initialized', 'ok');
  } catch (e) { log('Camera error: ' + e.message, 'err'); }
}
 
function stopCamera() {
  if (autoScanTimer) toggleAutoScan();
  if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
  const video = document.getElementById('videoEl');
  video.srcObject = null; video.style.display = 'none';
  document.getElementById('camPlaceholder').style.display = 'flex';
  document.getElementById('btnCapture').disabled = true;
  document.getElementById('btnStart').innerHTML = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 7l-7 5 7 5V7z"/><rect x="1" y="5" width="15" height="14" rx="2"/></svg> START CAM`;
  document.getElementById('btnStart').setAttribute('onclick', 'startCamera()');
  log('Webcam stopped', 'warn');
}

function toggleAutoScan() {
  const btn = document.getElementById('btnCapture');
  const label = document.getElementById('autoScanLabel');
  
  if (autoScanTimer) {
    clearInterval(autoScanTimer);
    autoScanTimer = null;
    label.textContent = 'AUTO SCAN';
    btn.classList.remove('active-scan');
    log('Live Auto-Scan deactivated', 'warn');
  } else {
    label.textContent = 'STOP SCANNING';
    btn.classList.add('active-scan');
    log('Live Auto-Scan activated - Tracking text...', 'ok');
    
    autoScanTimer = setInterval(() => {
      if (!ocrBusy && !isSpeaking && stream) captureFrame();
    }, 2500); // ขยายเวลาเป็น 2.5 วิ ให้เครื่องไม่หน่วงเกิน
    
    if (!ocrBusy) captureFrame();
  }
}
 
function captureFrame() {
  const video = document.getElementById('videoEl');
  if (!video.srcObject) return;
  
  const canvas = document.createElement('canvas');
  canvas.width = video.videoWidth; canvas.height = video.videoHeight;
  canvas.getContext('2d').drawImage(video, 0, 0);
  const dataUrl = canvas.toDataURL('image/jpeg', 0.9);
  
  // ในโหมดกล้อง Auto Scan เราจะรัน OCR โดยไม่ต้องแสดงภาพค้างไว้ให้จอกระตุก
  runOCR(dataUrl);
}
 
function displayImage(dataUrl) {
  const img = document.getElementById('capturedImg');
  const video = document.getElementById('videoEl');
  img.src = dataUrl; img.style.display = 'block'; video.style.display = 'none';
  document.getElementById('camPlaceholder').style.display = 'none';
}
 
function showArduinoSignal() {
  const badge = document.getElementById('arduinoBadge');
  const status = document.getElementById('arduinoStatus');
  badge.className = 'arduino-badge received';
  status.textContent = 'Image received from Arduino board!';
  setTimeout(() => { badge.className = 'arduino-badge'; status.textContent = 'Waiting for Arduino signal...'; }, 3000);
}
 
// ─── OCR ──────────────────────────────────────────────────────────────────────
async function runOCR(dataUrl) {
  if (ocrBusy) { pendingImage = dataUrl; return; }
  ocrBusy = true;
  
  const scanLine = document.getElementById('scanLine');
  const progressBar = document.getElementById('progressBar');
  const ocrStatus = document.getElementById('ocrStatus');
  const resultText = document.getElementById('resultText');
  const resultPlaceholder = document.getElementById('resultPlaceholder');
  const dot = document.getElementById('wsDot');
 
  dot.className = 'status-dot processing';
  scanLine.classList.add('active');
  ocrStatus.textContent = 'SCANNING';
  resultPlaceholder.style.display = 'none';
  document.getElementById('btnSpeak').disabled = true;
  document.getElementById('btnCopy').disabled = true;
 
  try {
    const worker = await Tesseract.createWorker('eng', 1, {
      logger: m => {
        if (m.status === 'recognizing text') {
          const pct = Math.round(m.progress * 100);
          progressBar.style.width = pct + '%';
          ocrStatus.textContent = `SCANNING ${pct}%`;
        }
      }
    });

    await worker.setParameters({
      // คืนค่าให้ตรวจจับสัญลักษณ์พื้นฐานทั้งหมด และเปลี่ยนโหมด PSM กลับเป็นโหมดที่ยืดหยุ่นสุด (3)
      tessedit_char_whitelist: '0123456789abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ.,?!@()-_=+/\'" \n',
      tessedit_pageseg_mode: '3', 
    });
 
    const result = await worker.recognize(dataUrl);
    await worker.terminate();

    const text = result.data.text.trim();
    const confidence = Math.round(result.data.confidence);
 
    progressBar.style.width = '100%';
    scanLine.classList.remove('active');
    dot.className = 'status-dot online';
 
    // ยอมรับผลลัพธ์ทุกอันที่มีข้อความ เพื่อให้คุณรู้ว่ามันอ่านอะไรออกบ้าง จะได้เช็คความชัดของกล้องได้
    if (text && text.length > 0) {
      currentText = text;
      resultText.textContent = text;
      ocrStatus.textContent = 'DONE';
      document.getElementById('btnSpeak').disabled = false;
      document.getElementById('btnCopy').disabled = false;
 
      const confBar = document.getElementById('confBar');
      const confVal = document.getElementById('confVal');
      confBar.style.width = confidence + '%';
      confBar.style.background = confidence > 70 ? `linear-gradient(90deg, #00cc7a, #00ff9d)` : `linear-gradient(90deg, #cc8800, #ffaa00)`;
      confVal.textContent = confidence + '%';
      confVal.style.color = confidence > 70 ? 'var(--green)' : '#ffaa00';
 
      log(`Text detected: ${confidence}% confidence`, 'ok');
      
      // ถ้าแม่นยำต่ำกว่า 30% จะยังไม่สั่งให้พูดอัตโนมัติ เพื่อป้องกันเสียงกวนใจตอนมันอ่านฝุ่น
      if(confidence > 30) {
          speakText();
      }
    } else {
      resultPlaceholder.style.display = 'block';
      resultPlaceholder.textContent = 'NO TEXT DETECTED (Try adjusting camera focus)';
      resultText.textContent = '';
      ocrStatus.textContent = 'NO TEXT';
    }
    setTimeout(() => { progressBar.style.width = '0%'; }, 1000);
 
  } catch (err) {
    dot.className = 'status-dot'; scanLine.classList.remove('active');
    ocrStatus.textContent = 'ERROR'; progressBar.style.width = '0%';
    log('OCR error: ' + err.message, 'err');
  } finally {
    ocrBusy = false;
    if (pendingImage) {
      const nextImage = pendingImage;
      pendingImage = null;
      runOCR(nextImage);
    }
  }
}

// ─── TTS ──────────────────────────────────────────────────────────────────────
function loadVoices() {
  voices = window.speechSynthesis.getVoices().filter(v => v.lang.startsWith('en'));
  const sel = document.getElementById('voiceSelect');
  sel.innerHTML = '';
  voices.forEach((v, i) => {
    const opt = document.createElement('option');
    opt.value = i; opt.textContent = v.name.length > 22 ? v.name.slice(0, 22) + '…' : v.name;
    sel.appendChild(opt);
  });
  if (!voices.length) { const opt = document.createElement('option'); opt.textContent = 'Default Voice'; sel.appendChild(opt); }
}
window.speechSynthesis.onvoiceschanged = loadVoices; setTimeout(loadVoices, 500);
 
function speakText() {
  if (!currentText) return;
  window.speechSynthesis.cancel();
  const utterance = new SpeechSynthesisUtterance(currentText);
  const sel = document.getElementById('voiceSelect');
  const rate = parseFloat(document.getElementById('rateSlider').value);
 
  if (voices[sel.value]) utterance.voice = voices[sel.value];
  utterance.rate = rate; utterance.lang = 'en-US';
 
  utterance.onstart = () => {
    isSpeaking = true;
    document.getElementById('speakLabel').textContent = 'STOP';
    document.getElementById('speakingWave').classList.add('active');
    document.getElementById('btnSpeak').setAttribute('onclick', 'stopSpeak()');
  };
  utterance.onend = () => {
    isSpeaking = false;
    document.getElementById('speakLabel').textContent = 'SPEAK';
    document.getElementById('speakingWave').classList.remove('active');
    document.getElementById('btnSpeak').setAttribute('onclick', 'speakText()');
  };
  utterance.onerror = () => { isSpeaking = false; document.getElementById('speakLabel').textContent = 'SPEAK'; document.getElementById('speakingWave').classList.remove('active'); document.getElementById('btnSpeak').setAttribute('onclick', 'speakText()'); };
  window.speechSynthesis.speak(utterance);
}
 
function stopSpeak() {
  window.speechSynthesis.cancel(); isSpeaking = false;
  document.getElementById('speakLabel').textContent = 'SPEAK';
  document.getElementById('speakingWave').classList.remove('active');
  document.getElementById('btnSpeak').setAttribute('onclick', 'speakText()');
}
 
document.getElementById('rateSlider').addEventListener('input', function() { document.getElementById('rateVal').textContent = parseFloat(this.value).toFixed(1); });
function copyText() { if (!currentText) return; navigator.clipboard.writeText(currentText).then(() => { const toast = document.getElementById('copyToast'); toast.classList.add('show'); setTimeout(() => toast.classList.remove('show'), 2000); }); }

// ─── Reset ────────────────────────────────────────────────────────────────────
function resetScanner() {
  if (autoScanTimer) toggleAutoScan();
  pendingImage = null;
  ocrBusy = false;

  const img = document.getElementById('capturedImg');
  const video = document.getElementById('videoEl');
  img.style.display = 'none'; img.src = '';
  if (stream) { video.style.display = 'block'; } else { document.getElementById('camPlaceholder').style.display = 'flex'; }

  currentText = '';
  document.getElementById('resultText').textContent = '';
  document.getElementById('resultPlaceholder').style.display = 'block';
  document.getElementById('resultPlaceholder').innerHTML = 'AWAITING SCAN INPUT<br><span style="font-size:10px;opacity:0.5">Start auto-scan or wait for board</span>';
  
  document.getElementById('ocrStatus').textContent = 'IDLE';
  document.getElementById('confBar').style.width = '0%';
  document.getElementById('confVal').textContent = '—';
  document.getElementById('confVal').style.color = 'var(--text2)';
  document.getElementById('progressBar').style.width = '0%';
  
  document.getElementById('btnSpeak').disabled = true;
  document.getElementById('btnCopy').disabled = true;
  
  stopSpeak(); log('Scanner reset to idle state', 'info');
}
 
function log(msg, type = '') {
  const area = document.getElementById('logArea');
  const now = new Date().toLocaleTimeString('en-GB', { hour12: false });
  const line = document.createElement('div'); line.className = 'log-line';
  line.innerHTML = `<span class="log-time">[${now}]</span><span class="log-msg ${type}">${msg}</span>`;
  area.appendChild(line); area.scrollTop = area.scrollHeight;
}
function clearLog() { document.getElementById('logArea').innerHTML = ''; }
 
// ─── Init ─────────────────────────────────────────────────────────────────────
connectWS(); log('System ready', 'ok');
</script>
