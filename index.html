<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OCR SCANNER - DRIVE EDITION</title>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;600&display=swap');
  :root { --bg: #050810; --bg2: #080d1a; --cyan: #00e5ff; --green: #00ff9d; --orange: #ff6b35; --red: #ff2d55; --text: #c8d8e8; --text2: #6a8aaa; --border: rgba(0,229,255,0.2); }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--bg); color: var(--text); font-family: 'Rajdhani', sans-serif; padding: 20px; }
  .container { max-width: 1000px; margin: 0 auto; }
  
  /* Panel & Layout */
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 20px; }
  @media (max-width: 768px) { .grid { grid-template-columns: 1fr; } }
  .panel { background: var(--bg2); border: 1px solid var(--border); border-radius: 12px; padding: 20px; position: relative; }
  .panel-title { font-family: 'Orbitron', monospace; color: var(--cyan); letter-spacing: 2px; margin-bottom: 15px; display: block; border-bottom: 1px solid var(--border); padding-bottom: 10px; }
  
  /* URL Input */
  .input-group { margin-bottom: 15px; }
  .input-group label { display: block; font-family: 'Share Tech Mono', monospace; font-size: 12px; color: var(--cyan); margin-bottom: 5px; }
  .input-group input { width: 100%; padding: 10px; background: rgba(0,229,255,0.05); border: 1px solid var(--border); color: var(--text); font-family: monospace; border-radius: 6px; }
  
  /* Viewer */
  .viewer { width: 100%; aspect-ratio: 4/3; background: #02060f; border: 1px solid rgba(0,229,255,0.15); border-radius: 8px; display: flex; align-items: center; justify-content: center; overflow: hidden; position: relative; }
  #capturedImg { width: 100%; height: 100%; object-fit: contain; display: none; }
  .viewer-text { font-family: 'Share Tech Mono', monospace; color: var(--text2); font-size: 12px; text-align: center; }
  
  /* Buttons */
  .btn-group { display: flex; gap: 10px; margin-top: 15px; }
  .btn { flex: 1; padding: 12px; border: none; border-radius: 8px; cursor: pointer; font-family: 'Orbitron', monospace; font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px; transition: 0.2s; }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn-sync { background: linear-gradient(135deg, #005f72, #007a90); color: var(--cyan); border: 1px solid var(--cyan); }
  .btn-sync:hover:not(:disabled) { box-shadow: 0 0 15px rgba(0,229,255,0.4); }
  .btn-speak { background: linear-gradient(135deg, #2a1a0a, #3d2810); color: var(--orange); border: 1px solid rgba(255,107,53,0.4); }
  
  /* Results */
  .result-box { min-height: 150px; background: #02060f; border: 1px solid rgba(0,229,255,0.1); border-radius: 8px; padding: 15px; font-family: 'Share Tech Mono', monospace; color: var(--green); white-space: pre-wrap; font-size: 14px; margin-top: 15px;}
  .progress-bar { height: 3px; width: 0%; background: var(--cyan); transition: 0.3s; margin-top: 10px; box-shadow: 0 0 8px var(--cyan); }
</style>
</head>
<body>

<div class="container">
  <h1 style="font-family: 'Orbitron'; color: var(--cyan); text-align: center; margin-bottom: 5px;">OCR CLOUD SCANNER</h1>
  <p style="font-family: 'Share Tech Mono'; color: var(--text2); text-align: center; font-size: 12px;">Google Drive Integration</p>

  <div class="grid">
    <div class="panel">
      <span class="panel-title">1. GOOGLE DRIVE IMAGE</span>
      
      <div class="input-group">
        <label>WEB APP URL (จาก Google Apps Script)</label>
        <input type="text" id="scriptUrl" placeholder="https://script.google.com/macros/s/..../exec">
      </div>

      <div class="viewer">
        <img id="capturedImg">
        <div class="viewer-text" id="viewerText">WAITING FOR IMAGE...<br>กดปุ่ม SYNC ด้านล่างเพื่อดึงรูปล่าสุดจาก Drive</div>
      </div>

      <div class="btn-group">
        <button class="btn btn-sync" id="btnSync" onclick="fetchFromDrive()">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 2v6h-6M3 12a9 9 0 0 1 15-6.7L21 8M3 22v-6h6M21 12a9 9 0 0 1-15 6.7L3 16"/></svg>
          SYNC & SCAN LATEST
        </button>
      </div>
    </div>

    <div class="panel">
      <span class="panel-title">2. DETECTED TEXT</span>
      <div style="font-family: 'Share Tech Mono'; font-size: 12px; color: var(--text2);" id="statusText">STATUS: IDLE</div>
      <div class="progress-bar" id="progressBar"></div>
      
      <div class="result-box" id="resultText"></div>

      <div class="btn-group">
        <button class="btn btn-speak" id="btnSpeak" onclick="speakText()" disabled>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M15.54 8.46a5 5 0 010 7.07M19.07 4.93a10 10 0 010 14.14"/></svg>
          REPLAY SPEECH
        </button>
      </div>
    </div>
  </div>
</div>

<script>
let currentText = '';
let voices = [];

// โหลดเสียงล่วงหน้า
function loadVoices() { voices = window.speechSynthesis.getVoices().filter(v => v.lang.startsWith('en')); }
window.speechSynthesis.onvoiceschanged = loadVoices;
setTimeout(loadVoices, 500);

// ฟังก์ชัน 1: ดึงรูปจาก Google Drive
async function fetchFromDrive() {
  const url = document.getElementById('scriptUrl').value.trim();
  if (!url) { alert("กรุณาใส่ URL ของ Web App ก่อนครับ!"); return; }

  // ปลดล็อกระบบเสียงของเบราว์เซอร์ทันทีที่ผู้ใช้คลิกปุ่ม
  window.speechSynthesis.speak(new SpeechSynthesisUtterance(''));

  const btn = document.getElementById('btnSync');
  const viewerText = document.getElementById('viewerText');
  const img = document.getElementById('capturedImg');
  const status = document.getElementById('statusText');

  btn.disabled = true;
  btn.innerHTML = 'DOWNLOADING...';
  status.textContent = 'STATUS: CONNECTING TO GOOGLE DRIVE...';
  
  try {
    // ยิง HTTP GET ไปที่ Google Apps Script
    const response = await fetch(url, { redirect: "follow" });
    const data = await response.json();

    if (data.status === 'success') {
      img.src = data.image; // แสดงรูปบนหน้าเว็บ
      img.style.display = 'block';
      viewerText.style.display = 'none';
      
      status.textContent = `STATUS: IMAGE FOUND (${data.filename})`;
      
      // ส่งรูปที่ได้ไปเข้ากระบวนการอ่านข้อความ
      runOCR(data.image);
    } else {
      alert("Error: " + data.message);
      status.textContent = 'STATUS: IDLE';
    }
  } catch (error) {
    alert("เชื่อมต่อไม่ได้! ตรวจสอบ URL อีกครั้ง");
    console.error(error);
  } finally {
    btn.disabled = false;
    btn.innerHTML = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 2v6h-6M3 12a9 9 0 0 1 15-6.7L21 8M3 22v-6h6M21 12a9 9 0 0 1-15 6.7L3 16"/></svg> SYNC & SCAN LATEST`;
  }
}

// ฟังก์ชัน 2: แปลงภาพเป็นตัวอักษร
async function runOCR(dataUrl) {
  const progressBar = document.getElementById('progressBar');
  const status = document.getElementById('statusText');
  const resultBox = document.getElementById('resultText');
  
  resultBox.textContent = '';
  document.getElementById('btnSpeak').disabled = true;
  
  try {
    const worker = await Tesseract.createWorker('eng', 1, {
      logger: m => {
        if (m.status === 'recognizing text') {
          const pct = Math.round(m.progress * 100);
          progressBar.style.width = pct + '%';
          status.textContent = `STATUS: SCANNING ${pct}%`;
        }
      }
    });

    // แก้ไขจุดที่เป็นบั๊กตรงนี้เรียบร้อยแล้วครับ
    await worker.setParameters({
      tessedit_char_whitelist: "0123456789abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ.,?!@()-_=+'\" \n",
      tessedit_pageseg_mode: '3', 
    });

    const result = await worker.recognize(dataUrl);
    await worker.terminate();

    const text = result.data.text.trim();
    progressBar.style.width = '100%';
    
    if (text) {
      currentText = text;
      resultBox.textContent = text;
      status.textContent = `STATUS: DONE (${Math.round(result.data.confidence)}% Confidence)`;
      document.getElementById('btnSpeak').disabled = false;
      
      // ให้พูดออกเสียงทันทีที่สแกนเสร็จ
      speakText();
    } else {
      resultBox.textContent = 'NO TEXT DETECTED IN THIS IMAGE.';
      status.textContent = 'STATUS: DONE (NO TEXT)';
    }
    setTimeout(() => { progressBar.style.width = '0%'; }, 1500);

  } catch (err) {
    status.textContent = 'STATUS: OCR ERROR';
    console.error(err);
  }
}

// ฟังก์ชัน 3: อ่านออกเสียง
function speakText() {
  if (!currentText) return;
  window.speechSynthesis.cancel();
  
  const utterance = new SpeechSynthesisUtterance(currentText);
  utterance.lang = 'en-US';
  
  if (voices.length > 0) utterance.voice = voices[0];
  window.speechSynthesis.speak(utterance);
}
</script>

</body>
</html>
